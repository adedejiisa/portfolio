name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK from HTML
        uses: Narottam04/action-capacitor-android@v1
        with:
          appName: 'Porta'
          appId: 'com.adedeji.porta'
          webDir: '.'
          # if your index.html dey inside folder, change '.' to that folder name

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Porta-APK
          path: '*.apk'
