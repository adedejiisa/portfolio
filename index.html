<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f2f4f8;color:#111;padding-bottom:82px}
.top{padding:32px 20px 18px}
.top small{color:#2563eb;font-weight:800;font-size:11px;letter-spacing:1px}
.top h1{font-size:27px;margin-top:8px;line-height:1.25}
.top p{color:#777;font-size:13.5px;margin-top:7px;line-height:1.5}
.score-card{background:#fff;border-radius:18px;margin:14px 16px 0;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.score-card h3{font-size:13px;color:#64748b}
.score-card span{font-size:11px;color:#999}
.progress{height:44px;background:#e2e8f0;border-radius:20px;margin-top:12px;overflow:hidden;position:relative}
.progress i{display:block;height:100%;background:#2563eb;border-radius:20px;transition:width .4s}
.progress b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;mix-blend-mode:normal;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.progress b.dark{color:#111;text-shadow:none}
.total-text{font-size:11px;color:#999;margin-top:8px;display:block;text-align:right}
.section{padding:0 16px;margin-top:14px}
.section h2{font-size:15px;margin-bottom:8px}
.history-item{background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.history-item b{font-size:13.5px}
.history-item small{color:#999;font-size:11px}
.badge{font-size:11px;padding:5px 9px;border-radius:99px;font-weight:700}
.badge.green{background:#dcfce7;color:#15803d}
.badge.orange{background:#ffedd5;color:#ea580c}
.empty{background:#fff;border-radius:12px;padding:18px;text-align:center;color:#999;font-size:12.5px}
.owner-card{background:#ddd;border-radius:18px;margin:14px 16px 0;padding:16px;color:#fff}
.owner-card b{font-size:16px; color:black; text-align: center;}
.owner-card small{color:#222;font-size:11.5px}
.owner-card p{font-size:12.5px;color:#222;line-height:1.6;margin-top:10px}
.owner-links{margin-top:12px;display:flex;gap:8px}
.owner-links a{flex:1;text-align:center;text-decoration:none;font-size:12.5px;font-weight:700;padding:11px 8px;border-radius:10px}
.owner-links a.wa{background:#25D366;color:#fff}
.owner-links a.mail{background:#fff;color:#111}
.owner-foot{margin-top:12px;text-align:center;font-size:10.5px;color:#777}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0 10px;border-top:1px solid #eee}
.nav a{color:#888;text-decoration:none;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.active{color:#2563eb;font-weight:700}
.nav button{border:none;background:none;color:#888;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.modal-box{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px;text-align:center}
.modal-box button{margin-top:12px;width:100%;padding:12px;border-radius:10px;border:none;background:#2563eb;color:#fff;font-weight:700}
</style>

<body>

<div class="top">

<div class="score-card">

  <div class="progress">

    <b id="totalPercent">0%</b>
  </div>

</div>
<!-- OWNER DETAILS -->
<div class="owner-card">
  <b>OLA VENTURES</b><br>
  <small>A Brand Strategist | PR | Entrepreneur</small>
  <div class="owner-links">
    <a class="wa" href="https://wa.me/2349074565526">WhatsApp Us</a>
    <a class="mail" href="tel:09074565526">Call Us</a>
  </div>
  <div class="owner-foot">© 2026 copyright</div>
</div>
<div class="section">
  <h2>Recent Quiz History</h2>
  <div id="recentHistory"></div>
</div>

<!-- BOTTOM NAV -->
<div class="nav">
  <a href="index.html" class="active"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>Home</a>
  <a href="quiz.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/></svg>Quiz</a>
  <a href="history.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>History</a>
  <a href="pdf.html"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>PDF</a>
  <button onclick="openUpdate()"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>Update</button>
</div>

<!-- UPDATE MODAL -->
<div class="modal" id="updateModal"></div>

<script>
function getHistory() { try { return JSON.parse(localStorage.getItem('porta_history') || '[]') } catch (e) { return [] } }

let h = getHistory();
let sumPercent = 0;

h.forEach(x => {
  let pct = (x.percent !== undefined && x.percent !== null) ?
    Number(x.percent) :
    (x.total > 0 ? Math.round(x.score / x.total * 100) : 0);
  sumPercent += pct;
});

// (100 + 0) / 2 = 50% — average, not 2/22
let p = h.length > 0 ? Math.round(sumPercent / h.length) : 0;

document.getElementById('totalPercent').textContent = p + '%';
document.getElementById('progressBar').style.width = p + '%';
document.getElementById('totalPercent').classList.toggle('dark', p < 30);

let el = document.getElementById('recentHistory');
if(h.length===0){
  el.innerHTML = '<div class="empty">No quiz history yet.<br>Take a quiz to see your recent history here.</div>';
} else {
  el.innerHTML = [...h].reverse().slice(0,5).map(x=>{
    let pct = x.percent ?? Math.round((x.score/x.total)*100);
    return `<div class="history-item"><div><b>${x.title||x.subject||'Quiz'}</b><br><small>${x.date||''}</small></div><span class="badge ${x.score/x.total>=0.5?'green':'orange'}">${x.score}/${x.total} • ${pct}%</span></div>`;
  }).join('');
}
</script>
<script src="checkuser.js"></script>
